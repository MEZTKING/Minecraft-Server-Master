# Runs the tests and builds the Windows installer on GitHub's Windows machines.
#
# * Every push / pull request: tests on Linux + a Windows installer build.
#   The installer is attached to the run as an artifact
#   (Actions tab -> the run -> "Artifacts" -> MinecraftServerMaster-Setup).
# * Publishing a GitHub Release (Releases -> Draft a new release -> Publish) builds the
#   installer and attaches it to that release.
#
# See docs/INSTALLER.md.
name: Build installer

on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -q tests

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Java 25 (Flashback companion mod)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Build the Flashback companion mod (bundled with the app)
        shell: pwsh
        run: |
          Push-Location companion
          gradle build --no-daemon --console=plain
          Pop-Location
          New-Item -ItemType Directory -Force mcsm/assets/mod | Out-Null
          Copy-Item companion/build/libs/mcsm-link-*.jar mcsm/assets/mod/
          Get-ChildItem mcsm/assets/mod
      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer
        shell: pwsh
        run: ./installer/build_windows.ps1 -Python python
      - name: Smoke test the bundle on a sample server
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0, 'tests'); from fixtures import build_server; build_server('build/sample-server')"
          & "dist\MinecraftServerMaster\mcsm.exe" summary build\sample-server --tz Europe/London
          if ($LASTEXITCODE -ne 0) { throw "summary failed" }
          & "dist\MinecraftServerMaster\mcsm.exe" report build\sample-server -o build\sample-report.html
          if ($LASTEXITCODE -ne 0) { throw "report failed" }
      - name: Smoke test the live map (bundled web assets, demo mode)
        shell: pwsh
        run: |
          $p = Start-Process "dist\MinecraftServerMaster\mcsm.exe" -ArgumentList "live", "build\sample-server", "--demo", "--no-browser", "--http-port", "8799" -PassThru
          try {
            Start-Sleep -Seconds 6
            $page = Invoke-WebRequest http://127.0.0.1:8799/ -UseBasicParsing
            if ($page.Content -notmatch "three.module.min.js") { throw "viewer page missing" }
            $lib = Invoke-WebRequest http://127.0.0.1:8799/vendor/three.module.min.js -UseBasicParsing
            if ($lib.StatusCode -ne 200) { throw "three.js not bundled" }
            $state = Invoke-RestMethod http://127.0.0.1:8799/api/state
            if ($state.status -ne "live" -or $state.players.Count -lt 1) { throw "no live demo players" }
            Write-Host "live map OK: $($state.players.Count) demo players"
          } finally { Stop-Process -Id $p.Id -Force }
      - name: Silent install / uninstall test
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\installer\*.exe)[0].FullName
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/DIR=$env:RUNNER_TEMP\mcsm-install", "/TASKS=addtopath" -Wait
          & "$env:RUNNER_TEMP\mcsm-install\mcsm.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "installed mcsm.exe does not run" }
          if (-not (Test-Path "$env:RUNNER_TEMP\mcsm-install\Minecraft Server Master.exe")) { throw "GUI exe missing" }
          Start-Process "$env:RUNNER_TEMP\mcsm-install\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          # The uninstaller re-launches itself from a temp copy, so wait for the files to go.
          for ($i = 0; $i -lt 30 -and (Test-Path "$env:RUNNER_TEMP\mcsm-install\mcsm.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$env:RUNNER_TEMP\mcsm-install\mcsm.exe") { throw "uninstall left files behind" }
      - uses: actions/upload-artifact@v4
        with:
          name: MinecraftServerMaster-Setup
          path: dist/installer/*.exe
          if-no-files-found: error

  # Every successful build of the working branch also goes to the public pre-release "latest-build",
  # so the app's updater (mcsm/updater.py, "test builds") can download it without signing in.
  latest-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/exciting-cannon-d0r8dm'
    needs: [test, windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/download-artifact@v4
        with:
          name: MinecraftServerMaster-Setup
          path: dist
      - name: Publish to the latest-build pre-release
        run: |
          set -e
          VERSION=$(grep -m1 '^__version__' mcsm/__init__.py | cut -d'"' -f2)
          EXE=$(ls dist/*.exe | head -n1)
          cp "$EXE" dist/MinecraftServerMaster-Setup-latest.exe
          SHA=$(sha256sum dist/MinecraftServerMaster-Setup-latest.exe | cut -d' ' -f1)
          SIZE=$(stat -c %s dist/MinecraftServerMaster-Setup-latest.exe)
          NOTES=$(git log -8 --format='- %s')
          python3 - "$VERSION" "${{ github.run_number }}" "${GITHUB_SHA:0:7}" "$SHA" "$SIZE" "$NOTES" > dist/build.json <<'PY'
          import json, sys, datetime
          v, n, c, sha, size, notes = sys.argv[1:7]
          print(json.dumps({"version": v, "number": int(n), "commit": c, "sha256": sha, "size": int(size),
                            "file": "MinecraftServerMaster-Setup-latest.exe", "notes": notes,
                            "date": datetime.datetime.utcnow().strftime("%Y-%m-%d")}))
          PY
          if ! gh release view latest-build >/dev/null 2>&1; then
            gh release create latest-build --prerelease --target "$GITHUB_SHA" --title "Latest test build"               --notes "Newest test build of the app (updated on every successful build). Stable versions are the other releases."
          fi
          gh release upload latest-build dist/MinecraftServerMaster-Setup-latest.exe dist/build.json --clobber
          gh release edit latest-build --title "Latest test build: $VERSION (build ${{ github.run_number }})" --prerelease

  release:
    if: github.event_name == 'release'
    needs: [test, windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MinecraftServerMaster-Setup
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*.exe
