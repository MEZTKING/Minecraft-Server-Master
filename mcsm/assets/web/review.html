<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year in review</title>
<style>
:root { --bg: #101014; --card: #1b1b22; --ink: #f2f2f5; --muted: #a3a3b2; --line: #2c2c36;
  --accent: #6cc04a; --a2: #3fa7ff; --a3: #f2b134; --a4: #e2557c; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  padding: 12px 16px; background: rgba(16,16,20,.92); border-bottom: 1px solid var(--line); }
header h1 { font-size: 18px; margin: 0 8px 0 0; }
header a, header select { color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  padding: 5px 10px; text-decoration: none; font: inherit; }
header .note { color: var(--muted); font-size: 13px; }
main { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; display: grid; gap: 18px;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 16px; min-height: 180px;
  display: flex; flex-direction: column; gap: 8px; }
.card.wide { grid-column: 1 / -1; }
.card h2 { margin: 0; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.big { font-size: 40px; font-weight: 800; line-height: 1.05; }
.big small { font-size: 15px; font-weight: 500; color: var(--muted); }
.row { display: flex; gap: 18px; flex-wrap: wrap; }
.row > div { min-width: 90px; }
.label { color: var(--muted); font-size: 13px; }
.list { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.list li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--line); padding: 2px 0; }
.list li span:last-child { color: var(--muted); white-space: nowrap; }
.foot { margin-top: auto; color: var(--muted); font-size: 12px; }
.warn { color: var(--a3); }
.players { display: flex; flex-wrap: wrap; gap: 8px; }
.players a { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border-radius: 10px; background: #24242d;
  color: var(--ink); text-decoration: none; border: 1px solid var(--line); }
.players a:hover { border-color: var(--accent); }
.face { width: 28px; height: 28px; border-radius: 6px; image-rendering: pixelated; background: #333 center/cover; flex: none; }
.face.big { width: 64px; height: 64px; border-radius: 10px; }
svg text { fill: var(--muted); font-size: 10px; }
.empty { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1 id="title">Year in review</h1>
  <select id="year" title="Which year (calendar year)"></select>
  <a id="back" href="/review">The server's year</a>
  <a href="/" title="Back to the history viewer">History viewer</a>
  <span class="note" id="note"></span>
</header>
<main id="cards"><div class="card wide"><h2>Loading</h2><div class="empty">Putting the year together…</div></div></main>
<script>
const $ = s => document.querySelector(s);
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const DAYS = ["Mondays", "Tuesdays", "Wednesdays", "Thursdays", "Fridays", "Saturdays", "Sundays"];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = (v, d = 0) => (v ?? 0).toLocaleString(undefined, { maximumFractionDigits: d });
const day = iso => iso ? new Date(iso.length <= 10 ? iso + "T12:00:00" : iso).toLocaleDateString(undefined, { day: "numeric", month: "long" }) : "";
const hourText = h => h == null ? "" : `${String(h).padStart(2, "0")}:00–${String((h + 1) % 24).padStart(2, "0")}:00`;
const ordinal = n => n + (["th", "st", "nd", "rd"][(n % 100 > 10 && n % 100 < 14) ? 0 : (n % 10 < 4 ? n % 10 : 0)] || "th");
// where we are: /review, /review/<year>, /review/<year>/<player>
const parts = location.pathname.split("/").filter(Boolean).slice(1).map(decodeURIComponent);
const YEAR = parts[0] || "", PLAYER = parts[1] || "";

function card(title, body, foot = "", wide = false) {
  return `<section class="card${wide ? " wide" : ""}"><h2>${esc(title)}</h2>${body}${foot ? `<div class="foot">${foot}</div>` : ""}</section>`;
}
function list(rows) {
  return rows.length ? `<ul class="list">${rows.map(([a, b]) => `<li><span>${esc(a)}</span><span>${esc(b)}</span></li>`).join("")}</ul>` : `<div class="empty">Nothing this year.</div>`;
}
function bars(items, key, colour = "var(--accent)") {        // a small column chart (months)
  const W = 300, H = 90, n = Math.max(1, items.length), max = Math.max(1, ...items.map(i => i[key]));
  const w = W / n;
  return `<svg viewBox="0 0 ${W} ${H + 14}" width="100%">${items.map((it, i) => {
    const h = Math.round((it[key] / max) * H), m = +it.month.slice(5) - 1;
    return `<rect x="${i * w + 2}" y="${H - h}" width="${w - 4}" height="${h}" rx="2" fill="${colour}"><title>${MONTHS[m]}: ${it[key]}</title></rect>
      <text x="${i * w + w / 2}" y="${H + 11}" text-anchor="middle">${MONTHS[m][0]}</text>`;
  }).join("")}</svg>`;
}
function heatmap(grid) {                                       // weekday x hour
  const max = Math.max(0.01, ...grid.flat()), cw = 11, ch = 12;
  let s = `<svg viewBox="0 0 ${24 * cw + 30} ${7 * ch + 14}" width="100%" style="max-width:520px">`;
  grid.forEach((row, d) => {
    s += `<text x="0" y="${d * ch + 9}">${DAYS[d].slice(0, 3)}</text>`;
    row.forEach((v, h) => { s += `<rect x="${30 + h * cw}" y="${d * ch}" width="${cw - 1}" height="${ch - 1}" rx="2" fill="var(--a2)" opacity="${(0.08 + 0.92 * v / max).toFixed(2)}"><title>${DAYS[d]} ${hourText(h)}: ${v} h</title></rect>`; });
  });
  for (const h of [0, 6, 12, 18]) s += `<text x="${30 + h * cw}" y="${7 * ch + 11}">${h}:00</text>`;
  return s + "</svg>";
}
function span(st) {                                           // which backups a statistics card covers
  if (!st || !st.available) return `<span class="warn">No backups with statistics in this year.</span>`;
  const a = st.from ? day(st.from) : "joining", b = day(st.to);
  return `Statistics from the backups: ${a} to ${b}.` + (st.partial ? ` <span class="warn">Partial: no backup before the year started.</span>` : "")
    + (st.reset ? ` <span class="warn">Some totals went down (a reset): counted as 0.</span>` : "");
}
const face = (uuid, cls = "face") => `<span class="${cls}" ${uuid ? `data-uuid="${uuid}"` : ""}></span>`;
async function faces() {                                       // the face from each player's skin (the 8 x 8 front)
  for (const el of document.querySelectorAll("[data-uuid]")) {
    try {
      const r = await (await fetch(`/api/skin/${el.dataset.uuid.replace(/-/g, "")}`)).json();
      if (!r.found) continue;
      const img = new Image(); img.src = r.url; await img.decode();
      const c = document.createElement("canvas"); c.width = c.height = 8;
      const g = c.getContext("2d"); g.drawImage(img, 8, 8, 8, 8, 0, 0, 8, 8); g.drawImage(img, 40, 8, 8, 8, 0, 0, 8, 8);
      el.style.backgroundImage = `url(${c.toDataURL()})`;
    } catch (e) { /* no skin: the grey square stays */ }
  }
}

function serverCards(R) {
  const S = R.server, n = S.numbers, out = [];
  out.push(card(`${R.title} · ${R.key}`, `<div class="row">
      <div><div class="big">${num(n.hours)}<small> h</small></div><div class="label">played</div></div>
      <div><div class="big">${num(n.days)}</div><div class="label">days with someone online</div></div>
      <div><div class="big">${num(n.players)}</div><div class="label">players</div></div>
      <div><div class="big">${num(n.deaths)}</div><div class="label">deaths</div></div>
      <div><div class="big">${num(n.advancements)}</div><div class="label">advancements</div></div>
      <div><div class="big">${num(n.chat_lines)}</div><div class="label">chat lines</div></div></div>`,
    "From the server logs: days with no log are missing.", true));
  out.push(card("Players by month", bars(S.months, "players", "var(--a2)") +
    list(S.months.filter(mo => mo.new).map(mo => [`${MONTHS[+mo.month.slice(5) - 1]}: new players`, mo.new]))));
  out.push(card("Hours by month", bars(S.months, "hours")));
  out.push(card("When the server was busiest", heatmap(S.heatmap) +
    (S.busiest_day.date ? `<div>Busiest day: <b>${day(S.busiest_day.date)}</b> with ${num(S.busiest_day.hours, 1)} hours played.</div>` : ""),
    `Times in ${esc(R.tz)}.`, true));
  out.push(card("How everyone died", list(S.deaths.top.map(([c, k]) => [c, `${k}×`])) +
    (S.deaths.oddest ? `<div>The oddest: <i>${esc(S.deaths.oddest)}</i></div>` : "")));
  const rec = S.records, rr = [];
  if (rec.longest_session) rr.push(["Longest session", `${rec.longest_session.player}, ${num(rec.longest_session.hours, 1)} h on ${day(rec.longest_session.date)}`]);
  if (rec.furthest_km) rr.push(["Furthest travelled", `${rec.furthest_km.player}, ${num(rec.furthest_km.value, 1)} km`]);
  if (rec.most_mined) rr.push(["Most blocks mined", `${rec.most_mined.player}, ${num(rec.most_mined.value)}`]);
  if (rec.most_placed) rr.push(["Most blocks placed", `${rec.most_placed.player}, ${num(rec.most_placed.value)}`]);
  if (rec.most_mobs) rr.push(["Most mobs killed", `${rec.most_mobs.player}, ${num(rec.most_mobs.value)}`]);
  out.push(card("Records", list(rr), "Travel, mining, placing and mobs come from the backups' statistics."));
  out.push(card("Rarest advancements", list(S.advancements.rarest.map(a => [a.name, `${a.first}, ${day(a.date)}${a.holders === 1 ? " · the only one" : ` · ${a.holders} have it`}`])),
    `${num(S.advancements.total)} advancements earned this year.`));
  out.push(card("Everyone's year", `<div class="players">${R.order.map(nm => `<a href="/review/${R.key}/${encodeURIComponent(nm)}">${face(R.uuids[nm])}${esc(nm)}<span class="label">${num(R.players[nm].headline.hours)} h</span></a>`).join("")}</div>`, "", true));
  return out;
}

function playerCards(R, name) {
  const P = R.players[name];
  if (!P) return [card("Not found", `<div class="empty">${esc(name)} didn't play in ${esc(R.key)}.</div>`, "", true)];
  const h = P.headline, out = [], st = P.stats_span;
  out.push(card(`${name}'s ${R.key}`, `<div class="row" style="align-items:center">${face(R.uuids[name], "face big")}
      <div><div class="big">${num(h.hours)}<small> h</small></div><div class="label">played, ${ordinal(h.rank)} of ${h.of}</div></div>
      <div><div class="big">${num(h.days)}</div><div class="label">days online</div></div></div>`,
    h.logs_incomplete ? `<span class="warn">The logs miss some days: the game's own play time says ${num(h.stats_hours)} h.</span>` : "From the server logs.", true));
  out.push(card("Hours by month", bars(P.months, "hours") +
    (P.favourite_hour != null ? `<div>Favourite time: <b>${hourText(P.favourite_hour)}</b>, most on <b>${DAYS[P.favourite_weekday]}</b>.</div>` : ""),
    `Times in ${esc(R.tz)}.`));
  const f = P.firsts, fr = [];
  if (f.join) fr.push([f.new_this_year ? "Joined for the first time" : "First time online this year", day(f.join)]);
  if (f.advancement) fr.push([`First advancement: ${f.advancement.name}`, day(f.advancement.date)]);
  if (f.death) fr.push([`First death: ${f.death.text}`, day(f.death.date)]);
  out.push(card("Firsts", list(fr)));
  out.push(card("Travelled", P.travel.available ? `<div class="big">${num(P.travel.km, 1)}<small> km</small></div>` +
    list(P.travel.by.slice(0, 6).map(([k, v]) => [k, `${num(v, 1)} km`])) : `<div class="empty">No statistics for this year.</div>`, span(st)));
  out.push(card("Blocks", `<div class="row"><div><div class="big">${num(P.blocks.mined)}</div><div class="label">mined</div></div>
      <div><div class="big">${num(P.blocks.placed)}</div><div class="label">placed</div></div></div>` +
    list([...P.blocks.mined_top.map(([k, v]) => [`mined ${k}`, num(v)]), ...P.blocks.placed_top.map(([k, v]) => [`placed ${k}`, num(v)])]), span(st)));
  out.push(card("Mobs", `<div class="big">${num(P.mobs.killed)}<small> killed</small></div>` +
    list([...P.mobs.top.map(([k, v]) => [k, num(v)]), ...P.mobs.killed_by.map(([k, v]) => [`killed by ${k}`, `${num(v)}×`])]), span(st)));
  const d = P.deaths;
  out.push(card("Deaths", `<div class="big">${num(d.count)}</div>` + list([
    ...(d.top_cause.length ? [["Most often", `${d.top_cause[0][0]} (${d.top_cause[0][1]}×)`]] : []),
    ...(d.worst_day ? [["Worst day", `${day(d.worst_day[0])}: ${d.worst_day[1]} deaths`]] : [])]), "From the server logs."));
  out.push(card("Advancements", `<div class="big">${num(P.advancements.count)}</div>` +
    (P.advancements.rarest ? `<div>Rarest: <b>${esc(P.advancements.rarest.name)}</b>${P.advancements.rarest.holders === 1 ? ", and nobody else has it" : `, ${P.advancements.rarest.holders} players have it`}.</div>` : "")));
  return out;
}

(async () => {
  let R;
  try { R = await (await fetch(`/api/review/${encodeURIComponent(YEAR)}`)).json(); }
  catch (e) { $("#cards").innerHTML = card("Couldn't load", `<div class="empty">${esc(e)}</div>`, "", true); return; }
  if (R.error) { $("#cards").innerHTML = card("Couldn't load", `<div class="empty">${esc(R.error)}</div>`, "", true); return; }
  document.title = PLAYER ? `${PLAYER}'s ${R.key}` : `${R.title}: ${R.key} in review`;
  $("#title").textContent = PLAYER ? `${PLAYER}'s year` : `${R.title}: the year in review`;
  $("#year").innerHTML = R.years.map(y => `<option${String(y) === R.key ? " selected" : ""}>${y}</option>`).join("");
  $("#year").onchange = () => { location.href = `/review/${$("#year").value}${PLAYER ? "/" + encodeURIComponent(PLAYER) : ""}`; };
  $("#back").href = `/review/${R.key}`; $("#back").style.display = PLAYER ? "" : "none";
  $("#note").textContent = `Calendar year ${R.key}, ${R.tz}.`;
  $("#cards").innerHTML = (PLAYER ? playerCards(R, PLAYER) : serverCards(R)).join("");
  faces();
})();
</script>
</body>
</html>
